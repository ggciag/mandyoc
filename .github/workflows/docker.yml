name: publish-images

on:
  pull_request:
    paths:
      - '.ci/dependency-image'
      - 'docker/dependencies/Dockerfile'

  release:
    types:
      - published

  # Allows run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  dependency-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.dependency.outputs.image }}

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@148d9a848c6acaf90a3ec30bc5062f646f8a4163
        with:
          access_token: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need full history to diff against the previous release

      - name: Read dependency image tag
        id: dependency
        run: |
          echo "image=$(tr -d '\r\n' < .ci/dependency-image)" >> "$GITHUB_OUTPUT"

      - name: Check whether dependency files changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            git fetch --tags --force
            CURRENT_TAG="${{ github.event.release.tag_name }}"
            PREV_TAG=$(git tag --sort=-creatordate | grep -vFx "$CURRENT_TAG" | head -n1)

            if [ -z "$PREV_TAG" ]; then
              echo "No previous release found, building dependency image"
              echo "changed=true" >> $GITHUB_OUTPUT
            elif git diff --quiet "$PREV_TAG" "$CURRENT_TAG" -- .ci/dependency-image docker/dependencies/Dockerfile; then
              echo "Dependency files unchanged since $PREV_TAG"
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "Dependency files changed since $PREV_TAG"
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          else
            # pull_request / workflow_dispatch: the pull_request trigger's
            # `paths:` filter already guarantees this only ran because these
            # files changed
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: steps.changed.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push dependency image
        if: steps.changed.outputs.changed == 'true'
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/dependencies/Dockerfile
          push: true
          tags: ${{ steps.dependency.outputs.image }}

      - name: Image digest
        if: steps.changed.outputs.changed == 'true'
        run: echo ${{ steps.docker_build.outputs.digest }}

  mandyoc-image:
    needs: dependency-image
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read dependency image
        id: dependency
        run: |
          echo "image=$(tr -d '\r\n' < .ci/dependency-image)" >> "$GITHUB_OUTPUT"

      - name: Define mandyoc tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            {
              echo "tags<<EOF"
              echo "ggciag/mandyoc:latest"
              echo "ggciag/mandyoc:${{ github.event.release.tag_name }}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "tags=ggciag/mandyoc:latest" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push mandyoc image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/mandyoc/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            DEPENDENCY_IMAGE=${{ steps.dependency.outputs.image }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
